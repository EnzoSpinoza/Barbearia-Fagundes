<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel — Barbearia Fagundes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/painel.css">
</head>
<body>
<header>
  <a class="brand" href="/">Fagundes. Painel</a>
  <button id="out" class="sm" hidden>Sair</button>
</header>
<main>
  <section id="login">
    <h2>Entrar no painel</h2>
    <form id="lf" class="lf">
      <label class="lab" for="em">E-mail</label>
      <input id="em" type="email" autocomplete="username" required>
      <label class="lab" for="pw">Senha</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p id="lm" role="status"></p>
      <button class="btn wide">Entrar</button>
    </form>
  </section>

  <section id="app" hidden>
    <nav class="tabs" id="tabs">
      <button data-t="agenda">Agenda</button>
      <button data-t="servicos">Serviços</button>
      <button data-t="financeiro">Financeiro</button>
      <button data-t="assinaturas">Assinaturas</button>
      <button data-t="pix">Pix</button>
    </nav>
    <p id="tm" role="status"></p>
    <div id="v"></div>
  </section>
</main>
<script src="/painel.js"></script>
</body>
</html>
